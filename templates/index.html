<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Emotion Detector</title>
  <style>
    body { font-family: system-ui,sans-serif; max-width: 750px; margin: 55px auto; padding: 0 16px; }
    h1 { color: #254d69; }
    input { box-sizing: border-box; padding: 12px; width: 100%; font-size: 16px; }
    button { margin-top: 12px; padding: 11px 18px; cursor: pointer; }
    #system_response { margin-top: 20px; line-height: 1.6; white-space: pre-wrap; }
  </style>
  <script defer src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</head>
<body>
  <h1>NLP - Emotion Detection</h1>
  <label for="textToAnalyze">Please enter the text to be analyzed</label>
  <input id="textToAnalyze" type="text" placeholder="I am really happy today">
  <button type="button" onclick="RunSentimentAnalysis()">Run Sentiment Analysis</button>
  <h2>Result of Emotion Detection</h2>
  <div id="system_response" role="status"></div>
</body>
</html>
